<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mine Cart Animation Demo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #17212b;
      background: linear-gradient(180deg, #fbfdfe, #eef6f8);
    }

    .demo {
      width: min(760px, calc(100vw - 32px));
    }

    .stage {
      width: 720px;
      max-width: 100%;
      height: 170px;
      border: 1px solid rgba(31, 41, 51, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      overflow: hidden;
    }

    .panel {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
    }

    button {
      border: 1px solid rgba(31, 41, 51, 0.14);
      border-radius: 6px;
      padding: 8px 12px;
      color: #203542;
      background: #ffffff;
      font: 700 13px Inter, "Segoe UI", Arial, sans-serif;
      cursor: pointer;
    }

    button:hover {
      border-color: rgba(29, 111, 145, 0.36);
      color: #1d6f91;
      background: #f4fbfd;
    }
  </style>
</head>
<body>
  <main class="demo">
    <div id="stage" class="stage"></div>
    <div class="panel">
      <button id="rail">矿车移动</button>
      <button id="wave">中央招手</button>
      <button id="coal">颠簸移动</button>
      <button id="mirror">镜像颠簸</button>
      <button id="small">小尺寸框体</button>
    </div>
  </main>

  <script type="module">
    import { createMineCartAnimator } from "./src/animate.js";

    const stage = document.getElementById("stage");
    const animator = createMineCartAnimator({
      parent: stage,
      width: stage.clientWidth,
      height: stage.clientHeight
    });

    document.getElementById("rail").addEventListener("click", () => {
      animator.playRailRide({ width: stage.clientWidth, height: stage.clientHeight });
    });

    document.getElementById("wave").addEventListener("click", () => {
      animator.playWaveRide({ width: stage.clientWidth, height: stage.clientHeight });
    });

    document.getElementById("coal").addEventListener("click", () => {
      animator.playCoalRide({ width: stage.clientWidth, height: stage.clientHeight });
    });

    document.getElementById("mirror").addEventListener("click", () => {
      animator.playCoalRide({ width: stage.clientWidth, height: stage.clientHeight, mirrored: true });
    });

    document.getElementById("small").addEventListener("click", () => {
      animator.playWaveRide({ width: 420, height: 118, mirrored: true });
    });
  </script>
</body>
</html>
