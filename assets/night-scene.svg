<svg class="night-parallax-scene" viewBox="0 0 1200 1000" preserveAspectRatio="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nightSkyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061135"/>
      <stop offset="0.52" stop-color="#1d3173"/>
      <stop offset="0.78" stop-color="#6644a8"/>
      <stop offset="1" stop-color="#121f45"/>
    </linearGradient>
    <radialGradient id="milkyGlow" cx="54%" cy="42%" r="52%">
      <stop offset="0" stop-color="#dbe8ff" stop-opacity="0.2"/>
      <stop offset="0.54" stop-color="#b6caff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#b6caff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meteorGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff87c8" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#ff9eda" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff5c6" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="mountainBackGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e4f93" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#132b5e" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="mountainMidGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3c78" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#0a214e" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="mountainFrontGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2859" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#041631" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="riverGlowGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b89d7" stop-opacity="0.08"/>
      <stop offset="0.48" stop-color="#93b8ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6b89d7" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="lampGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g class="night-layer night-layer--sky">
    <rect width="1200" height="1000" fill="url(#nightSkyGradient)"/>
    <ellipse cx="650" cy="420" rx="560" ry="250" fill="url(#milkyGlow)"/>
  </g>
  <g class="night-layer night-layer--stars">
    <circle cx="52" cy="108" r="2.1"/><circle cx="128" cy="178" r="1.5"/><circle cx="236" cy="126" r="1.9"/>
    <circle cx="354" cy="214" r="1.5"/><circle cx="460" cy="148" r="2.2"/><circle cx="575" cy="190" r="1.4"/>
    <circle cx="642" cy="112" r="1.8"/><circle cx="746" cy="226" r="2.1"/><circle cx="858" cy="162" r="1.5"/>
    <circle cx="946" cy="206" r="2.2"/><circle cx="1084" cy="132" r="1.8"/><circle cx="1160" cy="238" r="1.5"/>
    <circle cx="710" cy="292" r="1.4"/><circle cx="1016" cy="276" r="1.7"/><circle cx="300" cy="304" r="1.5"/>
    <circle cx="168" cy="292" r="1.2"/><circle cx="520" cy="262" r="1.5"/><circle cx="1120" cy="318" r="1.4"/>
