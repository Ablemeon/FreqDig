      <line x1="930" y1="66" x2="930" y2="252"/>
      <circle cx="930" cy="255" r="4" class="lamp-cap"/>
      <path filter="url(#lampGlow)" d="M930 238l4 10 11 1-8 7 2 11-9-6-9 6 2-11-8-7 11-1z"/>
    </g>
    <g class="hanging-lamp hanging-lamp--star hanging-lamp--star-three">
      <line x1="1070" y1="66" x2="1070" y2="196"/>
      <circle cx="1070" cy="199" r="3.5" class="lamp-cap"/>
      <path filter="url(#lampGlow)" d="M1070 183l4 9 10 1-8 6 3 10-9-5-9 5 3-10-8-6 10-1z"/>
