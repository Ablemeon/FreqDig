  <g class="night-layer night-layer--meteors">
    <path class="meteor meteor--one" d="M70 118 L158 174" stroke="url(#meteorGradient)" stroke-width="4" stroke-linecap="round"/>
    <path class="meteor meteor--two" d="M424 92 L520 152" stroke="url(#meteorGradient)" stroke-width="4" stroke-linecap="round"/>
    <path class="meteor meteor--three" d="M778 236 L888 304" stroke="url(#meteorGradient)" stroke-width="4" stroke-linecap="round"/>
    <path class="meteor meteor--four" d="M1054 174 L1142 228" stroke="url(#meteorGradient)" stroke-width="3.5" stroke-linecap="round"/>
    <path class="meteor meteor--five" d="M598 320 L672 366" stroke="url(#meteorGradient)" stroke-width="3.2" stroke-linecap="round"/>
  </g>
  <g class="night-layer night-layer--horizon-glow">
    <path d="M0 594 C180 552 305 606 500 582 C675 560 798 612 970 580 C1060 563 1136 570 1200 596 L1200 760 L0 760 Z"/>
  </g>
  <g class="night-layer night-layer--mountains-far">
