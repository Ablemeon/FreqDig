    <path class="mountain-ridge mountain-ridge--back" d="M470 617 C540 588 610 574 684 606 C618 596 555 612 502 650 Z"/>
  </g>
  <g class="night-layer night-layer--mountains-mid">
    <path d="M0 770 C86 712 150 734 244 704 C338 674 420 748 516 714 C632 670 700 754 818 718 C928 684 1010 774 1100 710 C1145 679 1178 696 1200 718 L1200 1000 L0 1000 Z"/>
    <path class="mountain-ridge mountain-ridge--mid" d="M716 711 C782 690 848 690 920 720 C850 716 792 728 742 756 Z"/>
  </g>
  <g class="night-layer night-layer--mountains-front">
    <path d="M0 842 C78 748 158 762 260 786 C372 812 452 884 555 896 C705 916 820 946 935 918 C1026 894 1100 810 1200 830 L1200 1000 L0 1000 Z"/>
    <path class="mountain-river" d="M205 798 C340 776 426 862 590 910 C728 952 876 948 1042 864 C1118 826 1170 850 1188 924 C1060 966 815 982 604 944 C430 912 288 860 205 798 Z"/>
  </g>
  <g class="night-layer night-layer--mountains-near">
    <path d="M0 910 C88 862 180 872 286 900 C408 932 515 956 642 938 C760 922 862 878 980 892 C1082 904 1138 934 1200 922 L1200 1000 L0 1000 Z"/>
  </g>
  <g class="night-layer night-layer--lamps">
    <g class="hanging-lamp hanging-lamp--moon">
      <line x1="618" y1="66" x2="618" y2="282"/>
      <circle cx="618" cy="285" r="6" class="lamp-cap"/>
      <path class="moon-lamp" filter="url(#lampGlow)" d="M641 295a29 29 0 1 1-33-43 34 34 0 0 0 33 43z"/>
    </g>
    <g class="hanging-lamp hanging-lamp--star hanging-lamp--star-one">
